      component_id: sdc.tedbow_demo.dd-text
      inputs:
        text:
          value: "<p>Let’s be honest: real people are high-maintenance and rarely come with a 'skip intro' button. That’s why at TV Beevy, we believe your shows are your <em>real</em> friends. They don’t ask you to help them move, they never forget your birthday, and unlike your roommate, they actually stay quiet when you’re trying to sleep. Who needs a social life when you have a Season 4 cliffhanger?</p>"
